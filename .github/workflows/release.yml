name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked build dependencies
        run: pip install -r requirements-build.txt
      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = python -c "from trad2simp.version import __version__; print(__version__)"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/version mismatch' }
      - name: Regression tests
        run: python test_all.py
        env:
          PYTHONIOENCODING: utf-8
      - name: Audit source and history
        run: python scripts/audit.py
      - name: Audit dependency advisories
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --disable-pip --no-deps
      - name: Build fresh executable
        run: python -m PyInstaller --clean --noconfirm Trad2Simp.spec
      - name: Verify packaged executable
        run: |
          $app = Start-Process -FilePath .\dist\Trad2Simp.exe -ArgumentList '--selftest' -WindowStyle Hidden -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw 'Packaged self-test failed' }
          python scripts/audit.py --artifact dist/Trad2Simp.exe
          if ($LASTEXITCODE -ne 0) { throw 'Artifact audit failed' }
          python scripts/release_assets.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Trad2Simp-windows-x64
          path: dist/*
          if-no-files-found: error
      - name: Stage release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@28ab305d0ffa26d60ec4bd614126329e26c7a0ec # v3.0.4
        with:
          draft: true
          body_path: RELEASE_NOTES.md
          files: |
            dist/Trad2Simp.exe
            dist/SHA256SUMS.txt
            dist/THIRD_PARTY_NOTICES.txt
            dist/BUILD_INFO.txt
          fail_on_unmatched_files: true
      - name: Verify uploaded binary and publish as latest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --pattern Trad2Simp.exe --dir verified
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
          if ((Get-FileHash verified/Trad2Simp.exe).Hash -ne (Get-FileHash dist/Trad2Simp.exe).Hash) { throw 'Upload checksum mismatch' }
          $app = Start-Process -FilePath .\verified\Trad2Simp.exe -ArgumentList '--selftest' -WindowStyle Hidden -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw 'Uploaded binary self-test failed' }
          gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
