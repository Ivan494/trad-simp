name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python test_all.py
        env:
          PYTHONIOENCODING: utf-8

  convert-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OpenCC
        run: pip install 'opencc>=1.1.7'
      - name: Convert module imports without Windows
        run: |
          python - <<'PY'
          from trad2simp.convert import flip_script
          import trad2simp
          assert trad2simp.__version__
          trad = '今天是臺灣，我們喝咖啡。'
          simp = '今天是台湾，我们喝咖啡。'
          assert flip_script(trad) == simp
          assert flip_script(simp) == trad
          assert flip_script('hello') == 'hello'
          print('convert-linux OK', trad2simp.__version__)
          PY
